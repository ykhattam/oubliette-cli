[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oubliette"
version = "0.1.0"
description = "Paranoid AI coding assistant. Zero telemetry. Hard secret boundaries. Audit-grade logging."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Yassine Elkhattam"}]
keywords = ["ai", "security", "local", "llm", "paranoid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
oubliette = "oubliette.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
